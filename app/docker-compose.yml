services:
  dood-library:
    build: .
    image: dood-library:latest
    container_name: dood-library
    restart: unless-stopped
    ports:
      - "18082:8080"
    volumes:
      # 把 all-videos-and-links.xlsx 放到本目录，或改成宿主机上的实际路径
      - ./all-videos-and-links.xlsx:/data/library.xlsx:ro
      - ./data:/data
    environment:
      EXCEL_PATH: /data/library.xlsx
      DATA_DIR: /data
      DOWNLOAD_ROOT: "/app/Downloads"
      FETCH_INTERVAL_MS: "1200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
